ems;let showSell=false;function save(){localStorage.setItem(LS_SHOPS,JSON.stringify(shops));localStorage.setItem(LS_ITEMS,JSON.stringify(items));}function render(){const featured=[...items].filter(i=>i.featured).sort((a,b)=>{if(a.pinned)return-1;if(b.pinned)return 1;const sa=shops.find(s=>s.id===a.shopId)?.sales||0;const sb=shops.find(s=>s.id===b.shopId)?.sales||0;return sb-sa;});const app=document.getElementById('app');app.innerHTML=`<header class="p-4 border-b-2 border-[#39FF14] flex justify-between items-center sticky top-0 bg-black z-20"><div><h1 class="text-2xl md:text-4xl ant text-[#39FF14] tracking-wider">POURDAWGZ FLEA - NEWELL SD</h1><p class="mono text-[10px] text-white/60">BUCKET HAT #1 FOREVER • FREE SHOPS • EST 2019</p></div><button onclick="openSell()" class="bg-[#39FF14] text-black ant text-lg px-6 py-3 rounded-xl">+ SELL FREE</button></header><div class="max-w-7xl mx-auto p-3 md:p-6"><div class="border-2 border-[#39FF14] bg-zinc-900 rounded-2xl p-4 mb-6 flex gap-4"><img src="https://pourdawgz.biz/assets/black_bucket_hat.webp" class="w-28 h-28 md:w-40 md:h-40 object-cover rounded-xl border border-[#39FF14]"/><div class="flex-1"><div class="bg-[#39FF14] text-black mono text-[10px] font-bold px-2 py-1 inline-block rounded mb-2">PINNED #1 FOREVER - POURDAWGZ ORIGINAL</div><h2 class="ant text-xl md:text-3xl">BLACK BUCKET HAT - 9 YARDS LIGHT - FULL LED BRIM</h2><p class="mono text-xs text-white/60 mt-1">Budget $39.99 White Saw ON HAND • Full Color +$10 • Beast Mode Glow +$20 • Daylight tan pitbull face, night green glow, LED brim</p><div class="flex gap-2 mt-3 flex-wrap"><span class="bg-[#39FF14]/20 border border-[#39FF14] text-[#39FF14] mono text-xs px-3 py-1 rounded-full">$39.99 BUDGET</span><span class="bg-white/10 mono text-xs px-3 py-1 rounded-full">+$10 FULL COLOR</span><span class="bg-purple-900/50 mono text-xs px-3 py-1 rounded-full">+$20 GLOW BEAST</span></div></div></div><h3 class="ant text-lg tracking-widest mb-2">FEATURED SHOPS - TOP SELLERS GE white/30 truncate mt-1">${p.shopName}</div><button class="w-full mt-1 bg-white text-black mono text-[9px] font-bold py-1 rounded">BUY - STRIPE / SQUARE</button></div>`).join('')}</div></div>${showSell?`<div class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border-2 border-[#39FF14] rounded-2xl p-5 w-full max-w-md max-h-[90vh] overflow-auto"><h2 class="ant text-2xl text-[#39FF14] mb-1">CREATE FREE SHOP & LIST ITEM</h2><p class="mono text-[10px] text-white/50 mb-4">FREE FOREVER - ITEM SHOWS INSTANTLY - NO REFRESH</p><label class="mono text-[10px] text-[#39FF14] font-bold uppercase">Shop Name *</label><input id="sn" placeholder="Johnny B's Tools, Newell Junk Co..." class="w-full bg-black border border-white/20 p-3 rounded-xl mb-3 mono text-sm"/><label class="mono text-[10px] text-[#39FF14] font-bold uppercase">Item Title *</label><input id="ti" placeholder="BLACK BUCKET HAT, BEANIE, SHIRT..." class="w-full bg-black border border-white/20 p-3 rounded-xl mb-3 mono text-sm uppercase"/><label class="mono text-[10px] text-[#39FF14] font-bold uppercase">Price $ *</label><input id="pr" type="number" placeholder="39.99" class="w-full bg-black border border-white/20 p-3 rounded-xl mb-3 mono text-sm"/><label class="mono text-[10px] text-[#39FF14] font-bold uppercase">Photo URL (or leave blank)</label><input id="ph" placeholder="https://... or blank for default hat" class="w-full bg-black border border-white/20 p-3 rounded-xl mb-3 mono text-xs"/><label class="mono text-[10px] text-white/60 uppercase flex items-center gap-2 mb-4"><input id="feat" type="checkbox" checked class="accent-[#39FF14]"/> Make featured on main page (one per shop)</label><div class="flex gap-2"><button onclick="closeSell()" class="flex-1 bg-zinc-800 py-3 rounded-xl mono">Cancel</button><button onclick="doList()" class="flex-1 bg-[#39FF14] text-black font-bold py-3 rounded-xl ant text-lg">LIST IT NOW - FREE</button></div><p class="mono text-[9px] text-white/30 text-center mt-3">Bucket #1 stays pinned forever. Top sellers move up featured row after it.</p></div></div>`:'<div class="fixed bottom-5 right-5 md:hidden"><button onclick="openSell()" class="bg-[#39FF14] text-black font-black w-14 h-14 rounded-full shadow-2xl text-3xl">+</button></div>'}<div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#39FF14] text-black mono text-xs font-bold px-6 py-3 rounded-xl hidden z-[100]"></div>`;}function openSell(){showSell=true;render();}function closeSell(){showSell=false;render();}function doList(){const sn=document.getElementById('sn').value.trim();const ti=document.getElementById('ti').value.trim();const pr=parseFloat(document.getElementById('pr').value);const ph=document.getElementById('ph').value.trim()||'https://pourdawgz.biz/assets/black_bucket_hat.webp';const feat=document.getElementById('feat').checked;if(!ti||!pr)return toastMsg('ADD TITLE AND PRICE');let shop=shops.find(s=>s.name.toLowerCase()===sn.toLowerCase());if(!shop&&sn){shop={id:Date.now().toString(),name:sn,sales:0,color:'#FFFFFF'};shops.unshift(shop);}if(!shop)shop=shops[0];const newItem={id:Date.now().toString(),shopId:shop.id,shopName:shop.name,title:ti.toUpperCase(),price:pr,color:'black',type:'other',stock:'ON HAND',img:ph,featured:feat,pinned:false,sales:0};items.unshift(newItem);save();showSell=false;render();toastMsg('LISTED - FREE FOREVER!');}function toastMsg(m){const t=document.getElementById('toast');t.innerText=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500);}render();</script></body></html>
